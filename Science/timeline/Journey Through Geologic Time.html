<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey Through Geologic Time</title>
<style>
:root{color-scheme:light dark;--bg:#fbf8f1;--fg:#1d2430;--mut:#5d6675;--card:#fff;--line:#d9d3c4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#eef0f4;--mut:#a3abba;--card:#1f242d;--line:#343b49}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}h1{font-size:clamp(20px,3vw,30px);margin:0}header p{margin:0;color:var(--mut)}
#bar{display:flex;align-items:center;gap:10px;padding:0 20px 8px}button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer}button:focus-visible,.card:focus-visible{outline:3px solid #1976d2;outline-offset:2px}#track{flex:1;height:14px;border-radius:7px;position:relative;display:flex;overflow:hidden;cursor:pointer;border:1px solid var(--line)}#track div{height:100%}#thumb{position:absolute;top:-2px;bottom:-2px;width:10px;border:2px solid var(--fg);border-radius:7px;background:var(--card);pointer-events:none}#now{font-size:13px;color:var(--mut);min-width:150px;text-align:right;font-variant-numeric:tabular-nums}
#scroller{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;scroll-behavior:smooth;border-top:1px solid var(--line);scroll-snap-type:x mandatory}.col{flex:0 0 min(86vw,400px);display:flex;flex-direction:column;border-right:1px solid var(--line);scroll-snap-align:start}.head{padding:14px 16px 12px}.head .tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}.head h2{margin:2px 0;font-size:28px}.head .age{font-size:14px;font-weight:600}.head p{font-size:14px;margin:6px 0 0;line-height:1.4}.items{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;width:100%}.pic{width:64px;height:64px;border-radius:50%;display:block;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--line),var(--card))}.card b{font-size:15px}.card small{display:block;color:var(--mut);margin-top:3px;line-height:1.35}
#tip{position:fixed;z-index:5;width:min(330px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--card);border:2px solid var(--fg);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}#tip.on{display:block}#tip .big{width:100%;max-height:180px;object-fit:cover;border-radius:8px;background:var(--line)}#tip h3{margin:8px 0 4px}#tip p{margin:6px 0;line-height:1.45;color:var(--mut)}#close{float:right;padding:2px 8px}
@media(max-width:600px){header{padding:10px 12px 8px}#bar{padding:0 12px 8px;gap:6px}#now{min-width:104px;font-size:11px}.col{flex-basis:88vw}}
</style>
</head>
<body>
<header><h1>Journey Through Geologic Time</h1><p>Scroll or drag sideways from Earth’s birth to today. Select an image to learn more.</p></header>
<div id="bar"><button id="L" aria-label="Scroll back in time">◀</button><div id="track" aria-label="Timeline progress"><div id="thumb"></div></div><button id="R" aria-label="Scroll forward in time">▶</button><span id="now" aria-live="polite"></span></div>
<main id="scroller" tabindex="0" aria-label="Geologic time periods"></main>
<aside id="tip" role="dialog" aria-modal="false" aria-labelledby="tn"><button id="close" aria-label="Close details">×</button><img class="big" id="tb" alt=""><h3 id="tn"></h3><p id="tf"></p></aside>
<script>
// Every image below is a local JPG in this folder; the explicit mapping keeps filenames aligned with timeline items.
const periods=[
{n:"Hadean",start:4600,end:4000,eon:"Hadean Eon",era:"Precambrian",color:"#ae027e",summary:"Earth forms as a ball of molten rock. A giant impact makes the Moon.",items:[
["Molten Earth","The surface was covered in magma oceans and constant volcanic eruptions. No fossils survive from this time.","molten-earth.jpg"],["Moon-forming impact","A Mars-sized planet is thought to have struck the young Earth, throwing out debris that became the Moon.","moon-forming-impact.jpg"]]},
{n:"Archean",start:4000,end:2500,eon:"Archean Eon",era:"Precambrian",color:"#f0047f",summary:"Oceans form and the first life appears, all of it microscopic.",items:[
["First microbes","Single-celled life appeared in the oceans, and the oldest fossil evidence is more than 3.4 billion years old.","first-microbes.jpg"],["Stromatolites","Layered mounds built by mats of bacteria. They are some of the oldest fossils ever found.","stromatolites.jpg"]]},
{n:"Proterozoic",start:2500,end:538.8,eon:"Proterozoic Eon",era:"Precambrian",color:"#f73563",summary:"Oxygen builds up in the air, and the first complex, many-celled life appears.",items:[
["Oxygen makers","Cyanobacteria released oxygen for hundreds of millions of years and changed the atmosphere.","oxygen-makers.jpg"],["Dickinsonia","A flat, ribbed, oval animal from the Ediacaran Period at the very end of this eon. Scientists still debate what it was.","dickinsonia.jpg"],["Ediacaran biota","Soft-bodied fronds, discs and tubes were Earth’s first large, complex organisms.","ediacaran-biota.jpg"]]},
{n:"Cambrian",start:538.8,end:486.85,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#7fa056",summary:"The “Cambrian explosion”: most major animal groups show up in the fossil record.",items:[
["Trilobites","Armored, many-legged sea animals. Thousands of species lived through the Paleozoic.","trilobites.jpg"],["Anomalocaris","One of the largest predators of its day, up to about a meter long, with grasping appendages.","anomalocaris.jpg"],["Hallucigenia","A tiny, spiny worm-like animal that walked on pairs of legs. Early scientists even drew it upside down.","hallucigenia.jpg"]]},
{n:"Ordovician",start:486.85,end:443.1,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#009270",summary:"Seas teem with life, and a major ice age ends the period with a mass extinction.",items:[
["Giant nautiloids","Shelled relatives of squid, some with shells several meters long, hunted in the seas.","giant-nautiloids.jpg"],["Brachiopods and corals","Lampshell animals and early corals covered shallow sea floors.","brachiopods-and-corals.jpg"],["Jawless fish","Early fish with no jaws sucked up food from the sea floor.","jawless-fish.jpg"]]},
{n:"Silurian",start:443.1,end:419.62,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#b3e1b6",summary:"Life begins to creep onto land, and reefs spread through warm seas.",items:[
["Sea scorpions","Eurypterids were giant aquatic predators, and some grew longer than a person.","sea-scorpions.jpg"],["First land plants","Tiny vascular plants stood only a few centimeters tall.","first-land-plants.jpg"],["First jawed fish","Jaws evolved, which changed how animals hunt and defend themselves.","first-jawed-fish.jpg"]]},
{n:"Devonian",start:419.62,end:358.86,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#cb8c37",summary:"The “Age of Fishes.” Fish with limb-like fins begin to crawl toward land.",items:[
["Dunkleosteus","A 6-meter armored fish with bony, blade-like plates in place of teeth.","dunkleosteus.jpg"],["Tiktaalik","A fish with a flat head, neck and sturdy fins that could prop up its body in the shallows.","tiktaalik.jpg"],["First forests","Trees such as Archaeopteris spread across the land.","first-forests.jpg"]]},
{n:"Carboniferous",start:358.86,end:298.9,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#67a599",summary:"Vast swampy forests grow, and they later turn into coal.",items:[
["Meganeura","A giant dragonfly relative with a wingspan of about 70 centimeters.","meganeura.jpg"],["Coal forests","Giant club mosses and tree ferns grew in warm swamps.","coal-forests.jpg"],["Early amphibians","Large, salamander-like animals ruled the swamps.","early-amphibians.jpg"]]},
{n:"Permian",start:298.9,end:251.9,eon:"Phanerozoic Eon",era:"Paleozoic",color:"#f04028",summary:"All land joins into one supercontinent. The period ends with the worst mass extinction ever.",items:[
["Dimetrodon","A sail-backed animal that is actually more closely related to mammals than to dinosaurs.","dimetrodon.jpg"],["Pangea","One giant supercontinent with a very dry interior.","pangea.jpg"],["The Great Dying","Roughly 90% of ocean species vanished, and trilobites were among them.","the-great-dying.jpg"]]},
{n:"Triassic",start:251.9,end:201.4,eon:"Phanerozoic Eon",era:"Mesozoic",color:"#812b92",summary:"Life recovers. The first dinosaurs, mammals and sea reptiles appear.",items:[
["Coelophysis","A slim, fast early dinosaur that hunted in the Triassic scrub.","coelophysis.jpg"],["Ichthyosaurs","Dolphin-shaped marine reptiles that breathed air.","ichthyosaurs.jpg"],["First mammals","Small, shrew-like animals scurried beneath the feet of the dinosaurs.","first-mammals.jpg"]]},
{n:"Jurassic",start:201.4,end:143.1,eon:"Phanerozoic Eon",era:"Mesozoic",color:"#34b2c9",summary:"Giant plant-eating dinosaurs roam, and the first birds take to the air.",items:[
["Brachiosaurus","A towering long-necked giant that stood about 12 meters tall.","brachiosaurus.jpg"],["Stegosaurus","A plated plant eater with spikes on its tail.","stegosaurus.jpg"],["Archaeopteryx","A feathered, winged animal with teeth and a long bony tail, and an early link between dinosaurs and birds.","archaeopteryx.jpg"]]},
{n:"Cretaceous",start:143.1,end:66,eon:"Phanerozoic Eon",era:"Mesozoic",color:"#7fc64e",summary:"The age of Tyrannosaurus and Triceratops. An asteroid ends the dinosaurs.",items:[
["Tyrannosaurus rex","A top predator up to about 12 meters long, with one of the strongest bites of any land animal.","tyrannosaurus-rex.jpg"],["Triceratops","A three-horned plant eater with a huge bony frill.","triceratops.jpg"],["Flowering plants","Flowers evolved and began to spread across the world.","flowering-plants.jpg"],["Asteroid impact","A huge asteroid struck what is now Mexico about 66 million years ago, and non-bird dinosaurs went extinct.","asteroid-impact.jpg"]]},
{n:"Paleogene",start:66,end:23.04,eon:"Phanerozoic Eon",era:"Cenozoic",color:"#fd9a52",summary:"Mammals spread into the empty niches and quickly grow bigger.",items:[
["Basilosaurus","An early whale up to about 18 meters long, with a long, snake-like body.","basilosaurus.jpg"],["Titanoboa","A giant snake that lived in hot swamps, perhaps more than 12 meters long.","titanoboa.jpg"],["Early horses","Small, forest-dwelling animals about the size of a dog.","early-horses.jpg"]]},
{n:"Neogene",start:23.04,end:2.58,eon:"Phanerozoic Eon",era:"Cenozoic",color:"#ffe619",summary:"Grasslands spread, and our early human relatives stand up on two legs.",items:[
["Megalodon","A giant shark, perhaps 15 meters long, with teeth bigger than a human hand.","megalodon.jpg"],["Australopithecus","Early human relatives who walked upright. The famous skeleton “Lucy” belongs to this group.","australopithecus.jpg"],["Grazing horses","Horses grew bigger and developed teeth for chewing tough grass.","grazing-horses.jpg"]]},
{n:"Quaternary",start:2.58,end:0,eon:"Phanerozoic Eon",era:"Cenozoic",color:"#f9f97f",summary:"Ice ages come and go, and modern humans appear.",items:[
["Woolly mammoth","A furry, tusked relative of elephants that lived in the cold steppes.","woolly-mammoth.jpg"],["Saber-toothed cat","Smilodon had huge canine teeth and hunted large prey.","saber-toothed-cat.jpg"],["Homo sapiens","Modern humans appeared in Africa about 300,000 years ago.","homo-sapiens.jpg"],["Ice ages","Huge sheets of ice repeatedly spread across North America and Europe.","ice-ages.jpg"]]}
];
const scroller=document.getElementById('scroller'),track=document.getElementById('track'),thumb=document.getElementById('thumb'),now=document.getElementById('now'),tip=document.getElementById('tip');
function formatAge(age){return age>=1000?(age/1000).toFixed(2).replace(/\.?0+$/,'')+' billion':age+' million'}
function textColor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(.299*r+.587*g+.114*b)/255>.6?'#1d2430':'#fff'}
periods.forEach((period,index)=>{const col=document.createElement('section');col.className='col';const head=document.createElement('div');head.className='head';head.style.background=period.color;head.style.color=textColor(period.color);head.innerHTML=`<div class="tag">${period.eon} · ${period.era}</div><h2>${period.n}</h2><div class="age">${formatAge(period.start)}–${formatAge(period.end)} years ago</div><p>${period.summary}</p>`;const items=document.createElement('div');items.className='items';period.items.forEach(([name,description,file])=>{const card=document.createElement('button');card.className='card';card.type='button';card.dataset.name=name;card.dataset.description=description;const img=document.createElement('img');img.className='pic';img.src=file;img.alt=name;img.loading='lazy';img.onerror=()=>{img.alt=`Image unavailable: ${name}`;img.classList.add('missing')};const label=document.createElement('span');const title=document.createElement('b');title.textContent=name;const detail=document.createElement('small');detail.textContent=description;label.append(title,detail);card.append(img,label);card.addEventListener('click',()=>showDetails(card,img));items.append(card)});col.append(head,items);scroller.append(col);const segment=document.createElement('div');segment.style.flex='1';segment.style.background=period.color;track.insertBefore(segment,thumb)});
function showDetails(card,img){document.getElementById('tb').src=img.src;document.getElementById('tb').alt=card.dataset.name;document.getElementById('tn').textContent=card.dataset.name;document.getElementById('tf').textContent=card.dataset.description;tip.classList.add('on');const rect=card.getBoundingClientRect(),width=Math.min(330,innerWidth-16);let x=rect.right+10;if(x+width>innerWidth-8)x=rect.left-width-10;if(x<8)x=Math.max(8,(innerWidth-width)/2);tip.style.left=x+'px';tip.style.top=Math.max(8,Math.min(rect.top,innerHeight-tip.offsetHeight-8))+'px'}
document.getElementById('close').addEventListener('click',()=>tip.classList.remove('on'));document.addEventListener('keydown',e=>{if(e.key==='Escape')tip.classList.remove('on')});scroller.addEventListener('scroll',()=>{const max=scroller.scrollWidth-scroller.clientWidth,progress=max?scroller.scrollLeft/max:0;thumb.style.left=`calc(${progress*100}% - ${progress*10}px)`;const index=Math.min(periods.length-1,Math.floor(progress*periods.length));now.textContent=periods[index].n+' · '+formatAge(periods[index].start)+' years ago'});document.getElementById('L').onclick=()=>scroller.scrollBy({left:-scroller.clientWidth*.8,behavior:'smooth'});document.getElementById('R').onclick=()=>scroller.scrollBy({left:scroller.clientWidth*.8,behavior:'smooth'});track.addEventListener('click',e=>{const rect=track.getBoundingClientRect();scroller.scrollLeft=(e.clientX-rect.left)/rect.width*(scroller.scrollWidth-scroller.clientWidth)});scroller.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();scroller.scrollLeft+=e.deltaY*1.5}},{passive:false});scroller.dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
