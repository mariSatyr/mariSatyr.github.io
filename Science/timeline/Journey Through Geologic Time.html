<style>
:root{--bg:#fbf8f1;--fg:#1d2430;--mut:#5d6675;--card:#fff;--line:#d9d3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#eef0f4;--mut:#a3abba;--card:#1f242d;--line:#343b49}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#eef0f4;--mut:#a3abba;--card:#1f242d;--line:#343b49}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px 8px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}h1{font-size:clamp(20px,3vw,30px);margin:0}header p{margin:0;color:var(--mut);font-size:14px}
#bar{display:flex;align-items:center;gap:10px;padding:0 20px 8px}#bar button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer}
#track{flex:1;height:14px;border-radius:7px;position:relative;display:flex;overflow:hidden;cursor:pointer;border:1px solid var(--line)}#track div{height:100%}#thumb{position:absolute;top:-2px;bottom:-2px;border:3px solid var(--fg);border-radius:6px;pointer-events:none}
#now{font-size:13px;color:var(--mut);min-width:150px;text-align:right;font-variant-numeric:tabular-nums}
#scroller{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;scroll-behavior:smooth;border-top:1px solid var(--line)}.col{flex:0 0 min(86vw,400px);display:flex;flex-direction:column;border-right:1px solid var(--line);position:relative}
.head{padding:14px 16px 12px}.head .tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}.head h2{margin:2px 0;font-size:28px}.head .age{font-size:14px;font-weight:600}.head .d{font-size:13px;margin-top:6px;line-height:1.4}
.items{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover,.card:focus{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.18);outline:none}
.pic{width:56px;height:56px;border-radius:50%;display:block;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--line),var(--card))}.card b{font-size:15px}.card small{display:block;color:var(--mut);font-size:12px}
#tip{position:fixed;z-index:50;width:min(310px,calc(100vw - 16px));background:var(--card);border:2px solid var(--fg);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .12s}#tip.on{opacity:1}#tip .big{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px;background:linear-gradient(135deg,var(--line),var(--card))}#tip h3{margin:0 0 4px;font-size:18px}#tip .w{font-size:12px;color:var(--mut);margin-bottom:6px}#tip p{margin:0;font-size:14px;line-height:1.45}#tip .credit{display:block;margin-top:8px;color:var(--mut);font-size:11px;line-height:1.4;pointer-events:auto}#tip .credit a{color:inherit}
@media(max-width:600px){header{padding:10px 12px 8px}#bar{padding:0 12px 8px;gap:6px}#now{min-width:104px;font-size:11px}.col{flex-basis:88vw}}
</style>
</head>
<body>
