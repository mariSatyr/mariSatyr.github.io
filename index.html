<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle Generator</title>
</head>
<body>
    <h1>Word Puzzle Generator</h1>
    <div>
        <h2>Word Scramble</h2>
        <input type="text" id="scrambleInput" placeholder="Enter words separated by commas">
        <button onclick="generateScramble()">Generate Scramble</button>
        <p id="scrambleOutput"></p>
    </div>
    <div>
        <h2>Crossword</h2>
        <input type="text" id="crosswordInput" placeholder="Enter words separated by commas">
        <button onclick="generateCrossword()">Generate Crossword</button>
        <div id="crosswordOutput"></div>
    </div>
    <script>
        function generateScramble() {
            const input = document.getElementById('scrambleInput').value;
            const words = input.split(',').map(word => word.trim());
            const scrambledWords = words.map(word => word.split('').sort(() => 0.5 - Math.random()).join(''));
            document.getElementById('scrambleOutput').innerHTML = scrambledWords.join(', ');
        }

        function generateCrossword() {
            const input = document.getElementById('crosswordInput').value;
            const words = input.split(',').map(word => word.trim());
            let crosswordHtml = '<table>';
            words.forEach(word => {
                crosswordHtml += '<tr>' + word.split('').map(letter => `<td>${letter}</td>`).join('') + '</tr>';
            });
            crosswordHtml += '</table>';
            document.getElementById('crosswordOutput').innerHTML = crosswordHtml;
        }
    </script>
</body>
</html>
