            <p class="mb-3"><strong>(12)</strong> In a few years, the high-speed railway will carry more than 250 freight trains and 55 passenger trains a day, with most traveling at speeds of around 100 to 125 miles per hour. <strong>(13)</strong> It will be faster for people to travel between northern and southern Europe. <strong>(14)</strong> The travel time between the European cities of Zurich, Switzerland, and Milan, Italy, will be reduced by an hour. <strong>(15)</strong> Many European leaders compare the Gotthard Base Tunnel to the Channel Tunnel, a 33-mile underwater tunnel that connects the United Kingdom and France. <strong>(16)</strong> While there is no roadway in the Channel Tunnel, people can drive their cars onto special trains that will carry vehicles through to the other side.</p>

        `;

                       <p>What is the value of x - y?</p>`,
                options: [
                    { label: "E", text: "-7" },
                    { label: "F", text: "-5" },
                    { label: "G", text: "5" },
                    { label: "H", text: "7" }
                ],
                correctLabel: "F"
            },
            {
                category: "Mathematics",
                text: `<p>If x = 1/4, what is the value of 2 / (2 - x)?</p>`,
                options: [
                    { label: "A", text: "3/4" },
                    { label: "B", text: "8/9" },
                    { label: "C", text: "1 1/7" },
                    { label: "D", text: "3 1/2" }
                ],
                correctLabel: "C"
            },
            {
                category: "Mathematics",
                text: `<p>The cost of shipping a package is $12, plus $2 for each additional pound over 3 pounds. Which expression represents the total cost, in dollars, of shipping a package that weighs p pounds? Assume that p &ge; 3.</p>`,
                options: [
                    { label: "E", text: "12 + 2(p + 3)" },
                    { label: "F", text: "12 + 2(p - 3)" },
                    { label: "G", text: "14p + 3" },
                    { label: "H", text: "14p - 3" }
                ],
                correctLabel: "F"
            },
            {
                category: "Mathematics",
                text: `<p>Julie is at a clothing store. She wants to buy a bag for $18.75 and some T-shirts for $9.25 each. She can spend no more than $50.00. Which inequality can be used to find the number of T-shirts, x, Julie can purchase?</p>`,
                options: [
                    { label: "A", text: "9.25x + 18.75 &le; 50.00" },
                    { label: "B", text: "9.25x + 18.75 &ge; 50.00" },
                    { label: "C", text: "18.75x + 9.25 &le; 50.00" },
                    { label: "D", text: "18.75x + 9.25 &ge; 50.00" }
                ],
                correctLabel: "A"
            },
            {
                category: "Mathematics",
                text: `<p>2x + 11 &gt; 3x + 9</p>
                       <p>For what values of x is the above inequality true?</p>`,
                options: [
                    { label: "E", text: "x < 2" },
                    { label: "F", text: "x > 2" },
                    { label: "G", text: "x < 20" },
                    { label: "H", text: "x > 20" }
                ],
                correctLabel: "E"
            }
        ];

        let currentIndex = 0;
        let userAnswers = []; // Store selected labels

        // DOM Elements
        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results-container');
        const questionCategory = document.getElementById('question-category');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const passageContainer = document.getElementById('passage-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');

        function init() {
            lucide.createIcons();
            loadQuestion(currentIndex);
        }

        function loadQuestion(index) {
            const q = questions[index];
            
            // Update Progress UI
            questionCounter.innerText = `Question ${index + 1} of ${questions.length}`;
            progressBar.style.width = `${((index) / questions.length) * 100}%`;

            // Reset and fade in new content
            const qBox = document.getElementById('question-box');
            qBox.classList.remove('fade-in');
            optionsContainer.classList.remove('fade-in');
            void qBox.offsetWidth; // Trigger reflow for animation
            qBox.classList.add('fade-in');
            optionsContainer.classList.add('fade-in');

            // Handle Passage Layout
            if (q.passage) {
                passageContainer.innerHTML = q.passage;
                passageContainer.classList.remove('hidden');
                passageContainer.classList.add('block');
            } else {
                passageContainer.classList.add('hidden');
                passageContainer.classList.remove('block');
            }

            // Populate Content
            questionCategory.innerText = q.category;
            questionText.innerHTML = q.text;
            
            optionsContainer.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-card w-full text-left bg-white border border-slate-200 rounded-xl p-4 flex items-start gap-4 hover:border-brand-300 hover:bg-slate-50 focus:outline-none";
                btn.onclick = () => selectOption(btn, opt.label);
                
                btn.innerHTML = `
                    <span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 border border-slate-200 text-slate-700 font-bold text-sm">
                        ${opt.label}
                    </span>
                    <span class="text-slate-700 leading-relaxed pt-1.5">
                        ${opt.text}
                    </span>
                `;
                optionsContainer.appendChild(btn);
            });

            // Reset Next Button
            nextBtn.disabled = true;
            
            // Change button text on last question
            if (index === questions.length - 1) {
                nextBtn.innerHTML = `<span>Submit Test</span><i data-lucide="check" class="w-4 h-4"></i>`;
                lucide.createIcons();
            }
        }

        let currentSelectedLabel = null;

        function selectOption(btnElement, label) {
            // Remove selected class from all options
            const allOptions = optionsContainer.children;
            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.remove('selected');
                // Reset inner span styles
                const span = allOptions[i].querySelector('span:first-child');
                span.classList.remove('bg-brand-600', 'text-white', 'border-brand-600');
                span.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-200');
            }

            // Add selected class to clicked option
            btnElement.classList.add('selected');
            const selectedSpan = btnElement.querySelector('span:first-child');
            selectedSpan.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200');
            selectedSpan.classList.add('bg-brand-600', 'text-white', 'border-brand-600');

            currentSelectedLabel = label;
            nextBtn.disabled = false;
        }

        function handleNext() {
            // Save answer
            userAnswers.push(currentSelectedLabel);
            currentSelectedLabel = null;

            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            resultsContainer.classList.add('flex');
            
            // Finalize progress bar
            progressBar.style.width = '100%';
            document.getElementById('header-status').innerText = "Test Complete";

            let correctCount = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            questions.forEach((q, i) => {
                const userAnswer = userAnswers[i];
                const isCorrect = userAnswer === q.correctLabel;
                if (isCorrect) correctCount++;

                const reviewItem = document.createElement('div');
                reviewItem.className = `p-5 rounded-xl border ${isCorrect ? 'bg-emerald-50/50 border-emerald-100' : 'bg-rose-50/50 border-rose-100'}`;
                
                const userOptText = q.options.find(o => o.label === userAnswer)?.text || "None";
                const correctOptText = q.options.find(o => o.label === q.correctLabel)?.text || "None";

                reviewItem.innerHTML = `
                    <div class="flex items-start gap-3 mb-3">
                        <div class="mt-1 flex-shrink-0">
                            ${isCorrect 
                                ? '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>' 
                                : '<i data-lucide="x-circle" class="w-5 h-5 text-rose-600"></i>'}
                        </div>
                        <div class="flex-1 text-sm">
                            <p class="font-bold text-slate-800 mb-1">Question ${i + 1} <span class="font-normal text-slate-500 ml-2">(${q.category})</span></p>
                            <div class="text-slate-600 mb-3 line-clamp-3">${q.text}</div>
                            
                            <div class="space-y-2 mt-2">
                                <div class="flex gap-2">
                                    <span class="text-slate-500 min-w-[80px]">Your Answer:</span>
                                    <span class="${isCorrect ? 'text-emerald-700 font-semibold' : 'text-rose-700 font-semibold'}">${userAnswer}. ${userOptText}</span>
                                </div>
                                ${!isCorrect ? `
                                <div class="flex gap-2">
                                    <span class="text-slate-500 min-w-[80px]">Correct:</span>
                                    <span class="text-slate-800 font-medium">${q.correctLabel}. ${correctOptText}</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
                reviewList.appendChild(reviewItem);
            });

            // Update Score Header
            const percentage = Math.round((correctCount / questions.length) * 100);
            document.getElementById('score-percentage').innerText = `${percentage}%`;
            document.getElementById('score-raw').innerText = correctCount;
            document.getElementById('score-total').innerText = questions.length;

            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
