<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum Trip Math: Guided Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F4; --surface:#FFFFFF; --ink:#17324D; --muted:#566B7E; --line:#CBD6DF;
  --accent:#E8A317; --accent-soft:#FFF3D6; --accent-ink:#5C3D00;
  --good:#1F7A48; --good-bg:#E3F4EA; --warn:#B4442E; --warn-bg:#FBE9E4; --hint:#4F46B8; --hint-bg:#ECEBFB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C28; --surface:#182838; --ink:#E6EEF5; --muted:#9AB0C3; --line:#2C4257;
    --accent:#F2B632; --accent-soft:#3A2E12; --accent-ink:#FFE1A0;
    --good:#6FD69C; --good-bg:#15362A; --warn:#FF9C86; --warn-bg:#3B211C; --hint:#B3ADFF; --hint-bg:#262457;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C28; --surface:#182838; --ink:#E6EEF5; --muted:#9AB0C3; --line:#2C4257;
  --accent:#F2B632; --accent-soft:#3A2E12; --accent-ink:#FFE1A0;
  --good:#6FD69C; --good-bg:#15362A; --warn:#FF9C86; --warn-bg:#3B211C; --hint:#B3ADFF; --hint-bg:#262457;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:1.5rem 1rem 4rem}
header h1{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;margin:.5rem 0 .4rem;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}

/* ticket strip */
.tickets{display:flex;gap:.6rem;overflow-x:auto;padding:1.25rem .1rem .75rem;scrollbar-width:thin}
.ticket{flex:0 0 auto;min-width:92px;border:none;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--surface);padding:.55rem .9rem .55rem 1rem;text-align:left;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  border-radius:4px;outline-offset:3px}
.ticket small{display:block;color:var(--muted);font-size:.72rem}
.ticket strong{font-size:1.05rem}
.ticket.current{background:var(--accent);color:var(--accent-ink)}
.ticket.current small{color:var(--accent-ink)}
.ticket .stamp{position:absolute;right:.35rem;top:.3rem;font-size:.7rem;font-weight:700;color:var(--good);transform:rotate(-12deg);border:1.5px solid currentColor;border-radius:3px;padding:0 .2rem;line-height:1.3}
.ticket.current .stamp{color:var(--accent-ink)}
.ticket:focus-visible{outline:3px solid var(--hint)}

/* story */
.story{background:var(--accent-soft);border-left:5px solid var(--accent);padding:.9rem 1.1rem;border-radius:0 8px 8px 0;margin:.5rem 0 1.25rem}
.story summary{cursor:pointer;font-weight:600}
.story p{margin:.5rem 0 0}

/* problem card */
.card{background:var(--surface);border-radius:14px;padding:1.4rem 1.3rem 1.2rem;border:1px solid var(--line)}
.card h2{margin:0 0 .35rem;font-size:1.45rem;line-height:1.2}
.card .task{margin:0 0 1.2rem;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 1.1rem 2.6rem}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:.05rem;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.9rem;border:2px solid var(--line);color:var(--muted)}
ol.steps>li.active::before{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
ol.steps>li.done::before{content:"✓";border-color:var(--good);background:var(--good);color:var(--surface)}
ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:.87rem;top:2.05rem;bottom:.2rem;width:2px;background:var(--line)}
.q{font-weight:500;margin:0 0 .5rem}
.done .q{font-weight:400;color:var(--muted);margin:0}
.given{display:inline-block;margin-top:.2rem;font-weight:600;color:var(--good);background:var(--good-bg);padding:.1rem .55rem;border-radius:6px}
.why{margin:.35rem 0 0;font-size:.93rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
input[type=text]{font:inherit;font-size:1.15rem;padding:.55rem .75rem;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 200px;max-width:320px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button.btn{font:inherit;font-weight:600;border:none;border-radius:8px;padding:.6rem 1.1rem;cursor:pointer;background:var(--ink);color:var(--surface)}
button.btn.ghost{background:transparent;color:var(--hint);padding:.4rem .5rem;font-weight:500;text-decoration:underline;text-underline-offset:3px}
button.choice{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:.55rem 1rem;cursor:pointer}
button.choice:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
.fb{margin:.6rem 0 0;padding:.55rem .8rem;border-radius:8px;font-size:.95rem}
.fb.bad{background:var(--warn-bg);color:var(--warn)}
.fb.hint{background:var(--hint-bg);color:var(--hint)}
.tip{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
.later{color:var(--muted);font-size:.93rem;padding-left:2.6rem;margin:0}
.finish{margin-top:1rem;padding:1rem 1.1rem;border-radius:10px;background:var(--good-bg);color:var(--good)}
.finish h3{margin:0 0 .3rem;font-size:1.15rem}
.finish p{margin:0 0 .8rem;color:var(--ink)}
.finish .btn{background:var(--good);color:var(--surface)}
footer{margin-top:1.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
footer button{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg);opacity:0}70%{transform:scale(1.25) rotate(-12deg)}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.stamp.new{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){.stamp.new{animation:none}}
.dl{margin-top:1rem;display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-weight:600;border:2px solid var(--ink);color:var(--ink);background:transparent;border-radius:8px;padding:.5rem 1rem;cursor:pointer;text-decoration:none}
.dl:hover{background:var(--ink);color:var(--surface)}
.dl-msg{font-size:.85rem;color:var(--muted);margin:.4rem 0 0;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Museum Trip Math</h1>
    <p>Work through each problem one small step at a time. Check each answer as you go, and use a hint whenever you're stuck.</p>
    <button class="dl" id="dl" hidden>Download the printable worksheet (PDF)</button>
    <p class="dl-msg" id="dlmsg" aria-live="polite"></p>
  </header>
  <nav class="tickets" id="tickets" aria-label="Problems"></nav>
  <main id="main"></main>
  <footer>
    <span>Type multiplication like <b>24(f+6)</b> or <b>24*f</b>. Your progress saves on this device.</span>
    <button id="reset">Start over</button>
  </footer>
</div>

<script>
// ---------- answer checking helpers ----------
function norm(s){
  s = String(s).toLowerCase().trim()
    .replace(/[×·*]/g,'').replace(/[−–—]/g,'-').replace(/÷/g,'/')
    .replace(/\$/g,'').replace(/\s+/g,'').replace(/,/g,'');
  s = s.replace(/[a-z]/g,'x');            // any letter counts as the variable
  s = s.replace(/\d*\.?\d+/g, m => String(Number(m)));
  return s;
}
const sum = (a,b) => [a+'+'+b, b+'+'+a];
const times = (k, inners) => inners.flatMap(i => [k+'('+i+')', '('+i+')'+k]);
const eq = (lhs, rhs) => lhs.flatMap(l => [l+'='+rhs, rhs+'='+l]);
const num = v => ({type:'num', value:v});
const expr = list => ({type:'expr', list});
const choice = (options, correct) => ({type:'choice', options, correct});

const MUSEUM = "A class of 24 students visited a science museum. Each student paid the museum's admission fee and $6 for lunch at the museum. The class spent a total of $336. What was the admission fee that each student paid?";
const FLOUR = "A grocer bought 25 bags of flour from a wholesaler. He marked up the price of each bag by $1.50, sold all of the flour for a total of $87.50. How much did the grocer pay the wholesaler for each bag of flour?";

const one = sum('x','6');
const PROBLEMS = [
 { title:"What does one student pay?", story:MUSEUM, storyName:"the museum story",
   task:"Let f represent the museum's admission fee. Write an expression for the total amount paid by each student.",
   steps:[
    {q:"Which letter stands for the admission fee?", a:expr(['x']), show:"f", why:"The problem tells us: let f be the admission fee.", hint:"Look at the first sentence of this problem: “Let ___ represent…”"},
    {q:"How much does each student pay for lunch, in dollars?", a:num(6), show:"$6", why:"Every student pays $6 for lunch.", hint:"Reread the story. Find the dollar amount next to the word “lunch.”"},
    {q:"To find one student's total, do you add or multiply the fee and the lunch cost?", a:choice(["Add","Multiply"],"Add"), show:"Add", why:"The student pays the fee AND the lunch, so we add them together.", hint:"If you pay for a ticket and then pay for lunch, how do you find what you spent altogether?"},
    {q:"Write the expression for what one student pays.", a:expr(one), show:"f + 6", why:"Fee plus lunch: f + 6. That's Problem 1's answer!", hint:"Put the fee and the lunch cost together with a + sign.", mistakes:{'6x':"That multiplies. Remember, we add the fee and the lunch."}}
   ]},
 { title:"What does the whole class pay?", story:MUSEUM, storyName:"the museum story",
   task:"Use your expression from Problem 1 to write an expression for the total amount paid by the entire class.",
   steps:[
    {q:"How many students are in the class?", a:num(24), show:"24", why:"There are 24 students.", hint:"Find the number of students in the first sentence of the story."},
    {q:"Every student pays f + 6. To get the whole class's cost, what do we do?", a:choice(["Add 24","Multiply by 24"],"Multiply by 24"), show:"Multiply by 24", why:"24 students each paying the same amount is 24 groups of (f + 6), so we multiply.", hint:"Adding 24 would mean paying $24 more. We need 24 copies of each student's cost."},
    {q:"Write the expression for the whole class. Use parentheses!", a:expr(times('24',one)), show:"24(f + 6)", why:"24(f + 6): the parentheses make sure 24 multiplies the fee AND the lunch.", hint:"Put f + 6 inside parentheses, then put 24 in front: 24( … )",
     mistakes:{'24x+6':"Close! Without parentheses, 24 only multiplies f. Wrap f + 6 in parentheses.",'6+24x':"Close! Without parentheses, 24 only multiplies f. Wrap f + 6 in parentheses."}}
   ]},
 { title:"Write the equation", story:MUSEUM, storyName:"the museum story",
   task:"Use your expression from Problem 2 to write an equation that represents the situation.",
   steps:[
    {q:"An equation needs an equal sign. How much did the class spend in total, in dollars?", a:num(336), show:"$336", why:"The class spent $336 altogether.", hint:"Look for the word “total” in the story."},
    {q:"Set the class expression equal to the total. Write the equation.", a:expr(eq(times('24',one),'336')), show:"24(f + 6) = 336", why:"24(f + 6) = 336 says: what the class paid equals $336.", hint:"Write 24(f + 6), then = , then the total."}
   ]},
 { title:"Use the Distributive Property", story:MUSEUM, storyName:"the museum story",
   task:"Rewrite the equation 24(f + 6) = 336 using the Distributive Property.",
   steps:[
    {q:"The 24 multiplies each term inside the parentheses. First: 24 × f = ?", a:expr(['24x','x24']), show:"24f", why:"24 times f is written 24f.", hint:"A number times a letter is written with the number in front, like 5 × n = 5n."},
    {q:"Now the second term: 24 × 6 = ?", a:num(144), show:"144", why:"24 × 6 = 144.", hint:"Try 20 × 6 and 4 × 6, then add them.", mistakes:{'30':"That's 24 + 6. We need to multiply."}},
    {q:"Write the new equation.", a:expr(eq(sum('24x','144'),'336')), show:"24f + 144 = 336", why:"24f + 144 = 336. The right side stays the same.", hint:"Put your two answers together with a +, then = 336.",
     mistakes:{'24x+6=336':"Remember: 24 multiplies the 6 too. What is 24 × 6?"}}
   ]},
 { title:"Solve it!", story:MUSEUM, storyName:"the museum story",
   task:"Solve 24f + 144 = 336. What was the admission fee that each student paid?",
   steps:[
    {q:"To get 24f by itself, undo the + 144 first. What number do we subtract from both sides?", a:num(144), show:"144", why:"Subtracting 144 undoes adding 144.", hint:"What number is being added to 24f? Do the opposite."},
    {q:"336 − 144 = ?", a:num(192), show:"24f = 192", why:"Now the equation is 24f = 192.", hint:"Subtract carefully: 336 − 100 = 236, then 236 − 44."},
    {q:"Now undo the multiplication. What do we divide both sides by?", a:num(24), show:"24", why:"24f means 24 times f, so dividing by 24 undoes it.", hint:"What number is multiplying f?"},
    {q:"192 ÷ 24 = ? (That's the value of f.)", a:num(8), show:"f = 8", why:"f = 8.", hint:"How many 24s fit in 192? Try 24 × 8."},
    {q:"Check it! Put f = 8 into 24(f + 6). What do you get?", a:num(336), show:"336 ✓", why:"24(8 + 6) = 24 × 14 = 336. It matches! Each student paid an $8 admission fee.", hint:"First 8 + 6, then multiply by 24."}
   ]},
 { title:"The flour problem", story:FLOUR, storyName:"the flour story", back:true,
   task:"How much did the grocer pay the wholesaler for each bag? This uses the same pattern as the museum problem. Let p be the price per bag.",
   steps:[
    {q:"How many bags of flour did the grocer buy?", a:num(25), show:"25", why:"25 bags, like the 24 students.", hint:"Find the number of bags in the first sentence."},
    {q:"How much was each bag marked up, in dollars?", a:num(1.5), show:"$1.50", why:"The markup is $1.50, like the $6 lunch: an extra amount added to each one.", hint:"Look for the words “marked up.”"},
    {q:"What was the total the grocer sold all the flour for?", a:num(87.5), show:"$87.50", why:"The total is $87.50.", hint:"Look for the word “total.”"},
    {q:"Write an expression for the price the grocer sells ONE bag for.", a:expr(sum('x','1.5')), show:"p + 1.50", why:"What he paid plus the markup: p + 1.50.", hint:"Same idea as f + 6: the unknown price plus the extra amount."},
    {q:"Write the equation for all the bags.", a:expr(eq(times('25',sum('x','1.5')),'87.5')), show:"25(p + 1.50) = 87.50", why:"25(p + 1.50) = 87.50.", hint:"Same shape as 24(f + 6) = 336.",
     mistakes:{'25x+1.5=87.5':"Don't forget the parentheses so 25 multiplies the markup too."}},
    {q:"Distribute: 25 × 1.50 = ?", a:num(37.5), show:"25p + 37.50 = 87.50", why:"25 × 1.50 = 37.50, so 25p + 37.50 = 87.50.", hint:"25 × 1 = 25 and 25 × 0.50 = 12.50. Add them."},
    {q:"Subtract 37.50 from both sides: 87.50 − 37.50 = ?", a:num(50), show:"25p = 50", why:"Now 25p = 50.", hint:"87.50 − 37.50: the .50s cancel out."},
    {q:"Divide both sides by 25. What is p?", a:num(2), show:"p = 2", why:"p = 2. Check: 25 × (2 + 1.50) = 25 × 3.50 = 87.50 ✓. The grocer paid $2.00 per bag.", hint:"50 ÷ 25 = ?"}
   ]}
];

// ---------- state ----------
const KEY = 'museum-math-progress-v1';
let state = load();
function fresh(){ return {p:0, step:PROBLEMS.map(()=>0), tries:{}}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.step) && s.step.length===PROBLEMS.length) return s; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let justStamped = -1, fb = null;

function isDone(i){ return state.step[i] >= PROBLEMS[i].steps.length; }

// ---------- render ----------
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderTickets(){
  document.getElementById('tickets').innerHTML = PROBLEMS.map((P,i)=>`
    <button class="ticket ${i===state.p?'current':''}" data-i="${i}" aria-current="${i===state.p?'step':'false'}">
      <small>${P.back?'On the back':'Problem'}</small><strong>${i+1}</strong>
      ${isDone(i)?`<span class="stamp ${i===justStamped?'new':''}">DONE</span>`:''}
    </button>`).join('');
}

function renderMain(){
  const i = state.p, P = PROBLEMS[i], cur = state.step[i];
  const tries = state.tries[i+'-'+cur] || 0;
  let html = `<details class="story" ${i===0||P.back?'open':''}><summary>Reread ${P.storyName}</summary><p>${esc(P.story)}</p></details>
  <section class="card" aria-live="polite">
    <h2>${i+1}. ${esc(P.title)}</h2><p class="task">${esc(P.task)}</p><ol class="steps">`;
  P.steps.forEach((S,k)=>{
    if(k < cur){
      html += `<li class="done"><p class="q">${esc(S.q)}</p><span class="given">${esc(S.show)}</span><p class="why">${esc(S.why)}</p></li>`;
    } else if(k === cur){
      html += `<li class="active"><p class="q" id="q${k}">${esc(S.q)}</p>`;
      if(S.a.type==='choice'){
        html += `<div class="row">${S.a.options.map(o=>`<button class="choice" data-choice="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      } else {
        html += `<div class="row"><input type="text" id="ans" aria-labelledby="q${k}" autocomplete="off" autocapitalize="off" spellcheck="false" ${S.a.type==='num'?'inputmode="decimal"':''}>
                 <button class="btn" id="check">Check</button></div>`;
      }
      if(fb) html += `<p class="fb ${fb.kind}">${esc(fb.text)}</p>`;
      html += `<div class="row" style="margin-top:.35rem"><button class="btn ghost" id="hint">Give me a hint</button>
               ${tries>=2?`<button class="btn ghost" id="show">Show me the answer</button>`:''}</div></li>`;
    }
  });
  html += `</ol>`;
  const left = P.steps.length - cur - 1;
  if(!isDone(i) && left>0) html += `<p class="later">${left} more step${left>1?'s':''} after this one.</p>`;
  if(isDone(i)){
    const next = PROBLEMS.findIndex((_,j)=>!isDone(j));
    html += `<div class="finish"><h3>Problem ${i+1} complete</h3>`;
    if(i===0) html += `<p>Answer: f + 6</p>`;
    if(i===1) html += `<p>Answer: 24(f + 6)</p>`;
    if(i===2) html += `<p>Answer: 24(f + 6) = 336</p>`;
    if(i===3) html += `<p>Answer: 24f + 144 = 336</p>`;
    if(i===4) html += `<p>Answer: f = 8, so each student paid an $8 admission fee.</p>`;
    if(i===5) html += `<p>Answer: p = 2, so the grocer paid $2.00 per bag.</p>`;
    html += next>=0 ? `<button class="btn" data-go="${next}">Go to Problem ${next+1}</button>` : `<p style="margin:0"><b>You finished every problem.</b> Write your answers on your worksheet!</p>`;
    html += `</div>`;
  }
  html += `</section>`;
  document.getElementById('main').innerHTML = html;
  const inp = document.getElementById('ans'); if(inp){ inp.focus({preventScroll:true}); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(inp.value); }); }
  const c = document.getElementById('check'); if(c) c.onclick = ()=>check(inp.value);
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>check(b.dataset.choice));
  const h = document.getElementById('hint'); if(h) h.onclick = ()=>{ fb={kind:'hint',text:'Hint: '+P.steps[cur].hint}; render(); };
  const s = document.getElementById('show'); if(s) s.onclick = ()=>advance();
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.p=+b.dataset.go; fb=null; save(); render(); window.scrollTo({top:0}); });
}
function render(){ renderTickets(); renderMain(); justStamped=-1; }

// ---------- actions ----------
function correct(S, raw){
  if(S.a.type==='choice') return raw===S.a.correct;
  const n = norm(raw);
  if(S.a.type==='num'){ const v = parseFloat(n); return !isNaN(v) && /^-?\d*\.?\d+$/.test(n) && Math.abs(v-S.a.value)<1e-9; }
  return S.a.list.map(norm).includes(n);
}
function check(raw){
  const i=state.p, S=PROBLEMS[i].steps[state.step[i]];
  if(!String(raw).trim()){ fb={kind:'bad',text:'Type an answer first, then press Check.'}; render(); return; }
  if(correct(S,raw)){ advance(); return; }
  const key=i+'-'+state.step[i]; state.tries[key]=(state.tries[key]||0)+1; save();
  const m = S.mistakes && S.mistakes[norm(raw)];
  fb = {kind:'bad', text: m || (state.tries[key]>=2 ? "Not quite. Try a hint, or tap “Show me the answer” to see it and keep going." : "Not quite. Check your work and try again.")};
  render();
}
function advance(){
  const i=state.p; state.step[i]++; fb=null;
  if(isDone(i)) justStamped=i;
  save(); render();
}
document.getElementById('tickets').addEventListener('click',e=>{
  const t=e.target.closest('.ticket'); if(!t) return; state.p=+t.dataset.i; fb=null; save(); render();
});
document.getElementById('reset').onclick=()=>{ if(confirm('Clear all progress and start over?')){ state=fresh(); fb=null; save(); render(); } };

<script>
(function(){
  const FILE='museum-math-worksheet.pdf';
  const btn=document.getElementById('dl'), msg=document.getElementById('dlmsg');
  function bytes(){ const s=atob(document.getElementById('pdfdata').textContent.trim()); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
  if(window.claude && typeof window.claude.use==='function'){
    // Published page: use the platform's download capability
    window.claude.use('downloads').then(dl=>{
      if(!dl) return;
      btn.hidden=false;
      btn.onclick=async()=>{
        msg.textContent='';
        try{ await dl.save({filename:FILE, data:new Blob([bytes()])}); msg.textContent='Worksheet downloaded.'; }
        catch(e){ if(e&&e.code==='declined') return;
          msg.textContent = e&&e.code==='rate_limited' ? 'A download prompt is already open. Finish that one first.' : 'This download isn\'t available here.'; }
      };
    }).catch(()=>{});
  } else {
    // Opened as a standalone file: a normal download link works
    btn.hidden=false;
    btn.onclick=()=>{ const url=URL.createObjectURL(new Blob([bytes()],{type:'application/pdf'}));
      const a=document.createElement('a'); a.href=url; a.download=FILE; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); };
  }
})();
</script>
