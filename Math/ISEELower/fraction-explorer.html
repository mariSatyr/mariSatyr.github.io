<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraction Pizza Explorer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8ec;--card:#ffffff;--ink:#2b2118;--muted:#6f6254;--line:#ecdcc0;--a:#e8743b;--b:#2f86e0;--empty:#fdf1d3;--crust:#c98a3d;--ok:#2e9e5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231a;--ink:#f6ead7;--muted:#c0ae95;--line:#4a3d2b;--empty:#3a3022;--crust:#b97b32}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a231a;--ink:#f6ead7;--muted:#c0ae95;--line:#4a3d2b;--empty:#3a3022;--crust:#b97b32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
.card h2{font-size:1.1rem;margin:0 0 4px}
.card p{margin:2px 0 10px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:700;font-size:1.5rem;line-height:1.1;vertical-align:middle}
.frac i{display:block;width:100%;height:3px;background:currentColor;margin:3px 0;border-radius:2px}
.mixed{font-size:1.5rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;border:2px solid var(--line)}
.ctl.a{border-color:var(--a)}.ctl.b{border-color:var(--b)}
.pair{display:flex;align-items:center;gap:8px}
.pair span{font-size:.8rem;color:var(--muted);min-width:3.4em;text-align:right}
.pair strong{font-size:1.6rem;min-width:1.6em;text-align:center}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:40px;min-height:40px;font-weight:700}
button:hover{border-color:var(--crust)}
.op button{font-size:1.4rem;min-width:52px;min-height:52px;border-radius:50%}
.op button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.presets button{padding:6px 12px;font-weight:600;font-size:.9rem}
.big{font-size:2.2rem;font-weight:700}
.pz{text-align:center}
.pz small{display:block;color:var(--muted)}
svg{max-width:100%;height:auto}
.answer{text-align:center;font-size:1.2rem}
.answer .row{margin:6px 0}
.hint{background:var(--empty);border-radius:12px;padding:8px 12px;margin:8px 0 0;color:var(--ink)!important}
.warn{color:#c0392b;font-weight:700;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:6px}
.legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<main>
<h1>🍕 Fraction Pizza Explorer</h1>
<p class="sub">Pick two fractions, choose + or −, and watch the pizza slices do the math.</p>

<div class="card">
  <div class="row" id="controls"></div>
  <div class="presets" id="presets"></div>
</div>
<div id="out"></div>
</main>

<script>
var S={an:1,ad:5,bn:1,bd:2,op:'+'};
var COL={1:'#e8743b',2:'#2f86e0'};
function gcd(a,b){return b?gcd(b,a%b):a}
function lcm(a,b){return a/gcd(a,b)*b}
function frac(n,d){return '<span class="frac"><span>'+n+'</span><i></i><span>'+d+'</span></span>'}
function mixed(n,d){
  var g=gcd(n,d)||1,sn=n/g,sd=d/g;
  if(n===0)return '<span class="mixed">0</span>';
  var w=Math.floor(sn/sd),r=sn%sd;
  if(sd===1)return '<span class="mixed">'+sn+'</span>';
  if(w>0)return '<span class="mixed">'+w+' '+frac(r,sd)+'</span>';
  return '<span class="mixed">'+frac(sn,sd)+'</span>';
}
// states: 0 empty, 1 colour A, 2 colour B, 3 taken away
function pizza(den,st,size){
  var r=size/2-6,c=size/2,out='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Pizza cut into '+den+' slices">';
  out+='<circle cx="'+c+'" cy="'+c+'" r="'+(r+4)+'" fill="var(--crust)"/>';
  for(var i=0;i<den;i++){
    var s=st[i]||0,fill=s===0?'var(--empty)':s===3?'#b8b0a4':COL[s];
    if(den===1){out+='<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="'+fill+'" stroke="var(--card)" stroke-width="2"/>';}
    else{
      var a1=-Math.PI/2+i*2*Math.PI/den,a2=-Math.PI/2+(i+1)*2*Math.PI/den;
      var x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1),x2=c+r*Math.cos(a2),y2=c+r*Math.sin(a2);
      out+='<path d="M'+c+' '+c+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+(den===2?1:0)+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+fill+'" stroke="var(--card)" stroke-width="2"/>';
    }
    var m=-Math.PI/2+(i+.5)*2*Math.PI/den,px=den===1?c:c+r*.6*Math.cos(m),py=den===1?c:c+r*.6*Math.sin(m);
    if(s===1||s===2)out+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+Math.max(4,r/(den>8?9:6)).toFixed(1)+'" fill="#fff" opacity=".85"/>';
    if(s===3)out+='<text x="'+px.toFixed(1)+'" y="'+(py+7).toFixed(1)+'" text-anchor="middle" font-size="'+Math.max(16,r/4)+'" font-weight="700" fill="#7a2a1f">✕</text>';
  }
  return out+'</svg>';
}
function states(den,filled,from,val){var a=[];for(var i=0;i<den;i++)a.push(0);for(var k=from;k<from+filled;k++)a[k]=val;return a}
function pz(den,st,label,size){return '<div class="pz">'+pizza(den,st,size||150)+'<small>'+label+'</small></div>'}
function stepper(id,label,val,min,max){
  return '<div class="pair"><span>'+label+'</span><button onclick="chg(\''+id+'\',-1)" aria-label="less '+label+'">−</button><strong>'+val+'</strong><button onclick="chg(\''+id+'\',1)" aria-label="more '+label+'">+</button></div>';
}
function chg(k,d){
  var v=S[k]+d;
  if(k==='an'||k==='bn')v=Math.max(0,Math.min(S[k==='an'?'ad':'bd'],v));
  else{v=Math.max(2,Math.min(12,v));var nk=k==='ad'?'an':'bn';if(S[nk]>v)S[nk]=v}
  S[k]=v;render();
}
function setOp(o){S.op=o;render()}
function swap(){var t;t=S.an;S.an=S.bn;S.bn=t;t=S.ad;S.ad=S.bd;S.bd=t;render()}
function preset(an,ad,op,bn,bd){S.an=an;S.ad=ad;S.op=op;S.bn=bn;S.bd=bd;render()}
function render(){
  document.getElementById('controls').innerHTML=
    '<div class="ctl a"><b style="color:var(--a)">First fraction</b>'+frac(S.an,S.ad)+stepper('an','slices eaten',S.an)+stepper('ad','slices total',S.ad)+'</div>'+
    '<div class="op"><button class="'+(S.op==='+'?'on':'')+'" onclick="setOp(\'+\')" aria-label="add">+</button> <button class="'+(S.op==='−'?'on':'')+'" onclick="setOp(\'−\')" aria-label="subtract">−</button></div>'+
    '<div class="ctl b"><b style="color:var(--b)">Second fraction</b>'+frac(S.bn,S.bd)+stepper('bn','slices eaten',S.bn)+stepper('bd','slices total',S.bd)+'</div>';
  document.getElementById('presets').innerHTML=
    '<button onclick="preset(1,5,\'+\',1,2)">1/5 + 1/2</button><button onclick="preset(3,7,\'−\',2,9)">3/7 − 2/9</button><button onclick="preset(1,4,\'+\',2,3)">1/4 + 2/3</button><button onclick="preset(3,4,\'+\',2,3)">3/4 + 2/3</button><button onclick="preset(5,6,\'−\',1,4)">5/6 − 1/4</button><button onclick="swap()">⇄ Swap fractions</button>';
  var L=lcm(S.ad,S.bd),am=L/S.ad,bm=L/S.bd,an=S.an*am,bn=S.bn*bm,sub=S.op==='−',h='';
  var opCh=sub?'−':'+';
  // step 1
  h+='<div class="card"><h2>Step 1: Here are the two pizzas</h2><p>The coloured slices are the part of each pizza we have.</p><div class="row">'+
    pz(S.ad,states(S.ad,S.an,0,1),frac(S.an,S.ad)+' of a pizza')+'<span class="big">'+opCh+'</span>'+
    pz(S.bd,states(S.bd,S.bn,0,2),frac(S.bn,S.bd)+' of a pizza')+'</div>'+
    '<p class="hint">The slices are <b>different sizes</b>'+(S.ad===S.bd?'… actually, they match already! Same-size slices are easy to combine.':', so we can’t just add or take away yet. We need matching slices!')+'</p></div>';
  // step 2
  h+='<div class="card"><h2>Step 2: Cut both pizzas into matching slices</h2><p>The smallest number both '+S.ad+' and '+S.bd+' go into is <b>'+L+'</b>, so we cut each pizza into '+L+' slices.</p><div class="row">'+
    pz(L,states(L,an,0,1),frac(S.an,S.ad)+' = '+frac(an,L),150)+'<span class="big">'+opCh+'</span>'+
    pz(L,states(L,bn,0,2),frac(S.bn,S.bd)+' = '+frac(bn,L),150)+'</div>'+
    (S.ad===S.bd?'':'<p class="hint">Each '+frac(1,S.ad)+' slice becomes '+am+' smaller slices, and each '+frac(1,S.bd)+' slice becomes '+bm+'. Same amount of pizza, just cut smaller!</p>')+'</div>';
  // step 3
  var bad=sub&&bn>an;
  if(bad){
    h+='<div class="card"><h2>Step 3: Put it together</h2><p class="warn">You can’t take away '+frac(S.bn,S.bd)+' from '+frac(S.an,S.ad)+' — there aren’t enough slices!</p><div class="row"><button onclick="swap()" style="padding:8px 16px">⇄ Swap the fractions</button></div></div>';
  }else{
    var total=sub?an-bn:an+bn,pizzas=Math.max(1,Math.ceil((sub?an:total)/L)),ph='';
    for(var p=0;p<pizzas;p++){
      var st=[];
      for(var i=0;i<L;i++){
        var idx=p*L+i,v=0;
        if(sub){ if(idx<an-bn)v=1; else if(idx<an)v=3; }
        else { if(idx<an)v=1; else if(idx<total)v=2; }
        st.push(v);
      }
      ph+=pz(L,st,pizzas>1?'Pizza '+(p+1):'',170);
    }
    var legend=sub?'<div class="legend"><span><b style="background:'+COL[1]+'"></b>slices left</span><span><b style="background:#b8b0a4"></b>slices taken away</span></div>':
      '<div class="legend"><span><b style="background:'+COL[1]+'"></b>from '+frac(S.an,S.ad).replace('class="frac"','class="frac" style="font-size:.8rem"')+'</span><span><b style="background:'+COL[2]+'"></b>from '+frac(S.bn,S.bd).replace('class="frac"','class="frac" style="font-size:.8rem"')+'</span></div>';
    h+='<div class="card"><h2>Step 3: '+(sub?'Take the slices away':'Put the slices together')+'</h2><p>'+
      (sub?'Start with '+an+' slices and take away '+bn+'. That leaves <b>'+total+'</b> slices.':'Count the slices: '+an+' + '+bn+' = <b>'+total+'</b> slices out of '+L+' in each pizza.')+'</p><div class="row">'+ph+'</div>'+legend+'</div>';
    var g=gcd(total,L)||1,simp=(total===0||g===1)?'':'<div class="row"><span>Simplify:</span>'+frac(total,L)+' = '+frac(total/g,L/g)+'</div>';
    var mx=(total>=L&&total!==L*Math.floor(total/L)||total>L)?'<div class="row"><span>As a mixed number:</span>'+mixed(total,L)+'</div>':'';
    h+='<div class="card answer"><h2>Answer</h2><div class="row">'+frac(S.an,S.ad)+'<span class="big">'+opCh+'</span>'+frac(S.bn,S.bd)+'<span class="big">=</span>'+frac(total,L)+'</div>'+simp+mx+'</div>';
  }
  document.getElementById('out').innerHTML=h;
}
render();
</script>
</body>
</html>
