<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#1b2440;--mute:#5b6585;--line:#d9dfec;--grid:#e6eaf3;--axis:#7a859f;
--pre:#3b6ef5;--prefill:rgba(59,110,245,.18);--img:#e8590c;--imgfill:rgba(232,89,12,.2);--accent:#3b6ef5;--accent-ink:#fff;--aux:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#182038;--ink:#eef1fb;--mute:#a4aecb;--line:#2c3558;--grid:#222b48;--axis:#8e9abb;--pre:#7aa2ff;--prefill:rgba(122,162,255,.2);--img:#ff9a5c;--imgfill:rgba(255,154,92,.22);--accent:#7aa2ff;--accent-ink:#0f1426;--aux:#69db7c}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#182038;--ink:#eef1fb;--mute:#a4aecb;--line:#2c3558;--grid:#222b48;--axis:#8e9abb;--pre:#7aa2ff;--prefill:rgba(122,162,255,.2);--img:#ff9a5c;--imgfill:rgba(255,154,92,.22);--accent:#7aa2ff;--accent-ink:#0f1426;--aux:#69db7c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0 .1em;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
.tab{flex:1;min-width:92px;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:800;cursor:pointer;transition:background .2s,border-color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--img);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block;background:var(--card);border-radius:12px;touch-action:manipulation}
label{font-weight:600;font-size:.92rem;display:block;margin-bottom:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;min-height:44px;width:100%}
input[type=range]{padding:0;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:8px 0}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.pt{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px}
.pt b{color:var(--pre);min-width:1.2em;text-align:center}
.pt input{padding:4px;min-height:40px;text-align:center}
h2{font-size:1.05rem;margin:0 0 6px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent)}
.note{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto}
.note small{display:block;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:.72rem}
.math{font-family:'Cambria Math','STIX Two Math',Georgia,serif;font-size:1.08rem;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tw{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 2px 0;font-size:.9rem;color:var(--mute)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:2px solid}
.err{color:var(--img);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>Transformation Lab</h1>
<p class="sub">Enter your own shape’s coordinates, pick a transformation, and watch the pre-image (blue) become the image (orange).</p>

<section class="card" aria-label="Your shape">
 <h2>1. Build your shape</h2>
 <div class="row" style="max-width:260px"><div><label for="np">Number of points</label>
 <select id="np"><option>3</option><option>4</option><option>5</option></select></div></div>
 <div class="pts" id="pts"></div>
</section>

<div class="tabs" role="tablist" aria-label="Transformations">
 <button class="tab" role="tab" id="t0" aria-selected="true" aria-controls="panel" data-i="0">Translate</button>
 <button class="tab" role="tab" id="t1" aria-selected="false" aria-controls="panel" data-i="1">Rotate</button>
 <button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="panel" data-i="2">Reflect</button>
 <button class="tab" role="tab" id="t3" aria-selected="false" aria-controls="panel" data-i="3">Dilate</button>
</div>

<div class="main" id="panel" role="tabpanel">
 <div class="card">
  <svg id="svg" role="img" aria-label="Coordinate plane showing the shape and its transformation"></svg>
  <div class="legend"><span><i class="sw" style="border-color:var(--pre);background:var(--prefill)"></i>Pre-image ABC</span><span><i class="sw" style="border-color:var(--img);background:var(--imgfill)"></i>Image A′B′C′</span></div>
  <div class="row" style="grid-template-columns:auto 1fr;align-items:center">
   <button class="btn" id="play">▶ Play</button>
   <div><label for="prog">Progress</label><input type="range" id="prog" min="0" max="100" value="100"></div>
  </div>
 </div>
 <div>
  <div class="card"><h2 id="ctlTitle"></h2><div id="ctl"></div></div>
  <div class="card" style="margin-top:14px"><h2>Notation</h2><div id="notation"></div></div>
 </div>
</div>
<div class="card tw" style="margin-top:14px"><h2>Coordinates, step by step</h2><div id="table"></div></div>
</div>

<script>
(function(){
var L='ABCDE';
var pts=[[1,1],[4,1],[1,3],[3,4],[0,3]].map(function(p){return p.slice()});
var n=3,tab=0,prog=1,timer=null;
var P={tx:3,ty:-2,ang:90,cx:0,cy:0,rline:'x-axis',rv:2,k:2,dx:0,dy:0};
var $=function(id){return document.getElementById(id)};
var f=function(v){v=Math.round(v*100)/100;return (Object.is(v,-0)?0:v).toString().replace('-','−')};
var sg=function(v,s){return (v<0?' − ':' + ')+f(Math.abs(v))};
var NS='http://www.w3.org/2000/svg';

function buildPts(){
 var h='';for(var i=0;i<n;i++)h+='<div class="pt"><b>'+L[i]+'</b>(<input type="number" step="0.5" aria-label="'+L[i]+' x" data-p="'+i+'" data-a="0" value="'+pts[i][0]+'">,<input type="number" step="0.5" aria-label="'+L[i]+' y" data-p="'+i+'" data-a="1" value="'+pts[i][1]+'">)</div>';
 $('pts').innerHTML=h;
}
$('pts').addEventListener('input',function(e){var t=e.target,v=parseFloat(t.value);if(isNaN(v))return;pts[+t.dataset.p][+t.dataset.a]=Math.max(-50,Math.min(50,v));draw()});
$('np').addEventListener('change',function(){n=+$('np').value;buildPts();draw()});

function num(id,label,key,step){return '<div><label for="'+id+'">'+label+'</label><input type="number" id="'+id+'" data-k="'+key+'" step="'+(step||1)+'" value="'+P[key]+'"></div>'}
function controls(){
 var h='';
 if(tab==0){$('ctlTitle').textContent='Translate: slide the shape';h='<div class="row">'+num('c1','Move right/left (a)','tx')+num('c2','Move up/down (b)','ty')+'</div><p class="sub">Positive a moves right, negative left. Positive b moves up, negative down.</p>'}
 if(tab==1){$('ctlTitle').textContent='Rotate: turn around a point';h='<div class="row">'+num('c1','Angle in degrees','ang',15)+'<div><label for="c5">Quick angles</label><select id="c5"><option value="">choose…</option><option>90</option><option>180</option><option>270</option><option>-90</option></select></div></div><div class="row">'+num('c2','Center x','cx',0.5)+num('c3','Center y','cy',0.5)+'</div><p class="sub">Positive angles turn counterclockwise, negative turn clockwise.</p>'}
 if(tab==2){$('ctlTitle').textContent='Reflect: flip over a line';h='<div class="row"><div><label for="c1">Line of reflection</label><select id="c1" data-k="rline"><option value="x-axis">x-axis (y = 0)</option><option value="y-axis">y-axis (x = 0)</option><option value="y=x">y = x</option><option value="y=-x">y = −x</option><option value="x=h">vertical line x = h</option><option value="y=k">horizontal line y = k</option></select></div>'+((P.rline=='x=h'||P.rline=='y=k')?num('c2',P.rline=='x=h'?'h =':'k =','rv',0.5):'')+'</div>'}
 if(tab==3){$('ctlTitle').textContent='Dilate: resize from a center';h='<div class="row">'+num('c1','Scale factor k','k',0.5)+'</div><div class="row">'+num('c2','Center x','cx',0.5)+num('c3','Center y','cy',0.5)+'</div><p class="sub">k &gt; 1 enlarges, 0 &lt; k &lt; 1 shrinks, negative k also flips through the center.</p>'}
 $('ctl').innerHTML=h;
 var s=$('c1');if(tab==2&&s)s.value=P.rline;
}
$('ctl').addEventListener('input',function(e){var t=e.target;if(t.id=='c5'){if(t.value!==''){P.ang=+t.value;controls();draw()}return}
 if(t.dataset.k=='rline'){P.rline=t.value;controls();draw();return}
 var v=parseFloat(t.value);if(isNaN(v)||!t.dataset.k)return;P[t.dataset.k]=v;draw()});

/* transform of a point, with t in [0,1] for animation */
function tf(p,t){
 var x=p[0],y=p[1];
 if(tab==0)return [x+P.tx*t,y+P.ty*t];
 if(tab==1){var a=P.ang*t*Math.PI/180,c=Math.cos(a),s=Math.sin(a),u=x-P.cx,v=y-P.cy;return [P.cx+u*c-v*s,P.cy+u*s+v*c]}
 if(tab==2){var q=refl(p);return [x+(q[0]-x)*t,y+(q[1]-y)*t]}
 var k=1+(P.k-1)*t;return [P.cx+(x-P.cx)*k,P.cy+(y-P.cy)*k];
}
function refl(p){var x=p[0],y=p[1],r=P.rline,v=P.rv;
 if(r=='x-axis')return [x,-y];if(r=='y-axis')return [-x,y];if(r=='y=x')return [y,x];if(r=='y=-x')return [-y,-x];
 if(r=='x=h')return [2*v-x,y];return [x,2*v-y]}
function clean(v){return Math.round(v*1e6)/1e6}

function el(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}

function draw(){
 var cur=pts.slice(0,n),fin=cur.map(function(p){return tf(p,1)}),now=cur.map(function(p){return tf(p,prog)});
 var m=10;[cur,fin].forEach(function(a){a.forEach(function(p){m=Math.max(m,Math.ceil(Math.abs(p[0]))+1,Math.ceil(Math.abs(p[1]))+1)})});
 m=Math.min(m,60);var step=m>40?10:m>20?5:m>12?2:1;
 var S=$('svg');S.innerHTML='';S.setAttribute('viewBox',-m+' '+-m+' '+2*m+' '+2*m);
 var sw=m/330,fs=m/16;
 for(var i=-m;i<=m;i++){var ax=i==0;
  S.appendChild(el('line',{x1:i,y1:-m,x2:i,y2:m,stroke:ax?'var(--axis)':'var(--grid)','stroke-width':ax?sw*2.6:sw*1.4}));
  S.appendChild(el('line',{x1:-m,y1:-i,x2:m,y2:-i,stroke:ax?'var(--axis)':'var(--grid)','stroke-width':ax?sw*2.6:sw*1.4}));
  if(i%step===0&&i!==0&&Math.abs(i)<m){S.appendChild(el('text',{x:i,y:fs*.9,'text-anchor':'middle','font-size':fs*.75,fill:'var(--mute)'},i<0?'−'+(-i):i));
   S.appendChild(el('text',{x:-fs*.25,y:-i+fs*.25,'text-anchor':'end','font-size':fs*.75,fill:'var(--mute)'},i<0?'−'+(-i):i))}}
 S.appendChild(el('text',{x:m-fs*.4,y:-fs*.4,'font-size':fs,fill:'var(--axis)','text-anchor':'end'},'x'));
 S.appendChild(el('text',{x:fs*.4,y:-m+fs*1.1,'font-size':fs,fill:'var(--axis)'},'y'));
 /* helper marks */
 if(tab==2){var r=P.rline,v=P.rv,ln=null;
  if(r=='x-axis')ln=[-m,0,m,0];if(r=='y-axis')ln=[0,-m,0,m];if(r=='y=x')ln=[-m,m,m,-m];if(r=='y=-x')ln=[-m,-m,m,m];if(r=='x=h')ln=[v,-m,v,m];if(r=='y=k')ln=[-m,-v,m,-v];
  S.appendChild(el('line',{x1:ln[0],y1:ln[1],x2:ln[2],y2:ln[3],stroke:'var(--aux)','stroke-width':sw*3.2,'stroke-dasharray':(sw*10)+' '+(sw*7)}))}
 if(tab==1||tab==3){S.appendChild(el('circle',{cx:P.cx,cy:-P.cy,r:fs*.3,fill:'var(--aux)'}));S.appendChild(el('text',{x:P.cx+fs*.45,y:-P.cy-fs*.45,'font-size':fs*.8,fill:'var(--aux)','font-weight':800},'center'))}
 function poly(a,stroke,fill,lab,dash){
  S.appendChild(el('polygon',{points:a.map(function(p){return p[0]+','+(-p[1])}).join(' '),fill:fill,stroke:stroke,'stroke-width':sw*3.2,'stroke-linejoin':'round','stroke-dasharray':dash||'none'}));
  a.forEach(function(p,i){S.appendChild(el('circle',{cx:p[0],cy:-p[1],r:fs*.26,fill:stroke}));
   S.appendChild(el('text',{x:p[0]+fs*.4,y:-p[1]-fs*.4,'font-size':fs*.95,'font-weight':800,fill:stroke,'paint-order':'stroke',stroke:'var(--card)','stroke-width':sw*5},L[i]+lab))})}
 poly(cur,'var(--pre)','var(--prefill)','');
 poly(now,'var(--img)','var(--imgfill)','′');
 if(tab==1&&prog>0&&prog<1){/* none */}
 notation(cur,fin);
}

function xy(p){return '('+f(p[0])+', '+f(p[1])+')'}
function names(s){var a='';for(var i=0;i<n;i++)a+=L[i]+s;return a}
function notation(cur,fin){
 var N=names(''),NP=names('′'),h='',rows='',i;
 function box(t,b){return '<div class="note"><small>'+t+'</small><span class="math">'+b+'</span></div>'}
 if(tab==0){var a=P.tx,b=P.ty;
  h=box('Mapping rule','(x, y) → (x'+sg(a)+', y'+sg(b)+')')+box('Vector / function notation','T<sub>⟨'+f(a)+', '+f(b)+'⟩</sub>('+N+') = '+NP)+box('In words','Slide '+f(Math.abs(a))+' unit(s) '+(a<0?'left':a>0?'right':'(no horizontal move)')+' and '+f(Math.abs(b))+' unit(s) '+(b<0?'down':b>0?'up':'(no vertical move)')+'.');
  for(i=0;i<n;i++)rows+=row(i,'('+f(pts[i][0])+sg(a)+', '+f(pts[i][1])+sg(b)+')')}
 if(tab==1){var g=((P.ang%360)+360)%360,rule,org=(P.cx==0&&P.cy==0);
  rule=g==90?'(x, y) → (−y, x)':g==180?'(x, y) → (−x, −y)':g==270?'(x, y) → (y, −x)':g==0?'(x, y) → (x, y)':'(x, y) → (x·cos θ − y·sin θ, x·sin θ + y·cos θ)';
  if(!org)rule='Shift so the center is the origin, rotate, then shift back:<br>(x, y) → (a + (x−a)cosθ − (y−b)sinθ, b + (x−a)sinθ + (y−b)cosθ), where (a, b) = '+xy([P.cx,P.cy]);
  h=box('Mapping rule'+(org&&[90,180,270].indexOf(g)>-1?' (about the origin)':''),rule)+box('Rotation notation','R<sub>'+f(P.ang)+'°, '+xy([P.cx,P.cy])+'</sub>('+N+') = '+NP)+box('In words','Rotate '+f(Math.abs(P.ang))+'° '+(P.ang<0?'clockwise':'counterclockwise')+' about '+xy([P.cx,P.cy])+'.');
  for(i=0;i<n;i++){var w=org&&[90,180,270].indexOf(g)>-1?ruleWork(g,pts[i]):'rotate '+f(P.ang)+'° about '+xy([P.cx,P.cy]);rows+=row(i,w)}}
 if(tab==2){var r=P.rline,rl={'x-axis':'(x, y) → (x, −y)','y-axis':'(x, y) → (−x, y)','y=x':'(x, y) → (y, x)','y=-x':'(x, y) → (−y, −x)','x=h':'(x, y) → (2h − x, y), h = '+f(P.rv),'y=k':'(x, y) → (x, 2k − y), k = '+f(P.rv)}[r],
  nm={'x-axis':'x-axis','y-axis':'y-axis','y=x':'y = x','y=-x':'y = −x','x=h':'x = '+f(P.rv),'y=k':'y = '+f(P.rv)}[r];
  h=box('Mapping rule',rl)+box('Reflection notation','r<sub>'+nm+'</sub>('+N+') = '+NP)+box('In words','Flip the shape over the line '+nm+'. Each point and its image are the same distance from the line.');
  for(i=0;i<n;i++){var q=refl(pts[i]);rows+=row(i,'reflect over '+nm+' → '+xy(q.map(clean)))}}
 if(tab==3){var k=P.k,o=(P.cx==0&&P.cy==0);
  h=box('Mapping rule',o?'(x, y) → ('+f(k)+'x, '+f(k)+'y)':'(x, y) → ('+xy([P.cx,P.cy]).slice(1,-1).split(', ')[0]+' + '+f(k)+'(x − '+f(P.cx)+'), '+f(P.cy)+' + '+f(k)+'(y − '+f(P.cy)+'))')+box('Dilation notation','D<sub>'+f(k)+', '+xy([P.cx,P.cy])+'</sub>('+N+') = '+NP)+box('In words',(Math.abs(k)>1?'Enlargement':Math.abs(k)<1&&k!==0?'Reduction':'Same size')+' with scale factor k = '+f(k)+(k<0?' (also flips through the center)':'')+'. Side lengths are multiplied by '+f(Math.abs(k))+'.');
  for(i=0;i<n;i++){var c=pts[i];rows+=row(i,o?'('+f(k)+'·'+f(c[0])+', '+f(k)+'·'+f(c[1])+')':'center + '+f(k)+'·(point − center)')}}
 $('notation').innerHTML=h;
 $('table').innerHTML='<table><tr><th>Point</th><th>Pre-image</th><th>Work</th><th>Image</th></tr>'+rows+'</table>';
}
function ruleWork(g,p){return g==90?'(−y, x) = (−('+f(p[1])+'), '+f(p[0])+')':g==180?'(−x, −y) = (−('+f(p[0])+'), −('+f(p[1])+'))':'(y, −x) = ('+f(p[1])+', −('+f(p[0])+'))'}
function row(i,w){var fp=tf(pts[i],1).map(clean);return '<tr><td><b>'+L[i]+' → '+L[i]+'′</b></td><td class="math">'+xy(pts[i])+'</td><td class="math">'+w+'</td><td class="math"><b>'+xy(fp)+'</b></td></tr>'}

/* tabs, play */
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
 tab=+b.dataset.i;document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===b)});
 $('panel').setAttribute('aria-labelledby',b.id);stop();prog=1;$('prog').value=100;controls();draw()})});
$('prog').addEventListener('input',function(){stop();prog=$('prog').value/100;draw()});
function stop(){if(timer){cancelAnimationFrame(timer);timer=null}$('play').textContent='▶ Play'}
$('play').addEventListener('click',function(){
 if(timer){stop();return}
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce){prog=prog>=1?0:1;$('prog').value=prog*100;draw();return}
 $('play').textContent='❚❚ Pause';var st=null,from=prog>=1?0:prog;
 function go(ts){if(st==null)st=ts;var t=Math.min(1,from+(ts-st)/2200*(1-from)/(1-from||1)*1);
  t=Math.min(1,from+(ts-st)/2200);prog=t;$('prog').value=t*100;draw();
  if(t<1)timer=requestAnimationFrame(go);else{timer=null;$('play').textContent='▶ Play'}}
 timer=requestAnimationFrame(go)});

buildPts();controls();draw();
})();
</script>
</body>
</html>
