<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audiobook Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a2118;--mut:#7a6c5d;--acc:#9c4a1a;--acc2:#f1e2d0;--line:#e4d8c8;--hl:#ffe3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#251e18;--ink:#f1e8dc;--mut:#a79886;--acc:#e8935a;--acc2:#3a2e24;--line:#3a3027;--hl:#5a4220}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#251e18;--ink:#f1e8dc;--mut:#a79886;--acc:#e8935a;--acc2:#3a2e24;--line:#3a3027;--hl:#5a4220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;font-family:system-ui,sans-serif}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:170px;resize:vertical;font-family:Georgia,serif}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
button{font:inherit;font-family:system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--acc2);color:var(--ink);border-radius:8px;padding:9px 14px}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
#reader{max-height:46vh;overflow:auto;padding:18px;font-size:18px;line-height:1.75}
#reader p{margin:0 0 1em}
#reader span{cursor:pointer;border-radius:4px;padding:1px 0}
#reader span.on{background:var(--hl)}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-family:system-ui,sans-serif}
#player .in{max-width:860px;margin:0 auto}
.note{color:var(--mut);font-size:13px;margin-top:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<main>
<h1>📚 Audiobook Reader</h1>
<p class="sub">Paste or upload text, pick an accent, and listen. Audio is generated by your own browser, so nothing is uploaded.</p>

<div class="card">
<label for="txt">Your text</label>
<textarea id="txt" placeholder="Paste a story, article, or chapter here…"></textarea>
<div class="bar">
<input type="file" id="file" accept=".txt,.md,.text,.html,.pdf,text/plain,application/pdf" hidden>
<button onclick="file.click()">📄 Upload PDF or text file</button>
<button onclick="sample()">Try a sample</button>
<button onclick="txt.value='';build()">Clear</button>
<span class="note" id="count"></span>
</div>
<div class="row">
<div><label for="acc">Accent / language</label><select id="acc"></select></div>
<div><label for="voice">Voice</label><select id="voice"></select></div>
</div>
<div class="row">
<div><label for="rate">Speed: <b id="rv">1.0</b>×</label><input type="range" id="rate" min="0.6" max="1.6" step="0.05" value="1"></div>
<div><label for="pitch">Pitch: <b id="pv">1.0</b></label><input type="range" id="pitch" min="0.6" max="1.5" step="0.05" value="1"></div>
</div>
<p class="note" id="vnote"></p>
<p class="note" id="rec"></p>
</div>

<div class="card" id="reader" aria-live="polite"><em style="color:var(--mut)">Your text will appear here as you listen. Click any sentence to start from there.</em></div>
</main>

<div id="player"><div class="in">
<input type="range" id="seek" min="0" max="0" value="0" aria-label="Position">
<div class="bar" style="margin-top:6px">
<button onclick="skip(-1)" title="Previous sentence">⏮</button>
<button class="primary" id="pp" onclick="toggle()">▶ Play</button>
<button onclick="skip(1)" title="Next sentence">⏭</button>
<button onclick="stop()">⏹ Stop</button>
<button id="mp3b" onclick="recordMp3()">⏺ Save as MP3</button>
<span class="note" id="pos" style="margin:0 0 0 auto"></span>
</div></div></div>

<script>
const ACCENTS=[['en-US','🇺🇸 American English'],['en-GB','🇬🇧 British English'],['en-AU','🇦🇺 Australian English'],['en-IE','🇮🇪 Irish English'],['en-IN','🇮🇳 Indian English'],['en-ZA','🇿🇦 South African English'],['en-CA','🇨🇦 Canadian English'],['fr-FR','🇫🇷 French'],['fr-CA','🇨🇦 Canadian French'],['de-DE','🇩🇪 German'],['it-IT','🇮🇹 Italian'],['es-ES','🇪🇸 Spanish (Spain)'],['es-MX','🇲🇽 Spanish (Mexico)'],['pt-BR','🇧🇷 Portuguese (Brazil)'],['pt-PT','🇵🇹 Portuguese (Portugal)'],['nl-NL','🇳🇱 Dutch'],['sv-SE','🇸🇪 Swedish'],['pl-PL','🇵🇱 Polish'],['ru-RU','🇷🇺 Russian'],['tr-TR','🇹🇷 Turkish'],['ar-SA','🇸🇦 Arabic'],['hi-IN','🇮🇳 Hindi'],['ja-JP','🇯🇵 Japanese'],['ko-KR','🇰🇷 Korean'],['zh-CN','🇨🇳 Chinese (Mandarin)']];
const $=id=>document.getElementById(id);
const txt=$('txt'),acc=$('acc'),voice=$('voice'),rate=$('rate'),pitch=$('pitch'),seek=$('seek'),reader=$('reader'),file=$('file');
const synth=window.speechSynthesis;
let voices=[],chunks=[],spans=[],idx=0,playing=false,token=0;

function norm(l){return (l||'').replace('_','-')}
function loadVoices(){
  voices=synth?synth.getVoices():[];
  const prev=acc.value;
  const avail=ACCENTS.filter(([c])=>voices.some(v=>norm(v.lang)===c));
  const extra=ACCENTS.filter(([c])=>!avail.includes([c])&&!voices.some(v=>norm(v.lang)===c)&&voices.some(v=>norm(v.lang).startsWith(c.split('-')[0])));
  const list=avail.concat(extra);
  acc.innerHTML=list.map(([c,n])=>`<option value="${c}">${n}</option>`).join('')||'<option value="">No voices found</option>';
  if(prev&&list.some(([c])=>c===prev))acc.value=prev;
  fillVoices();
}
function fillVoices(){
  const c=acc.value;let vs=voices.filter(v=>norm(v.lang)===c);
  if(!vs.length)vs=voices.filter(v=>norm(v.lang).startsWith(c.split('-')[0]));
  voice.innerHTML=vs.map(v=>`<option value="${v.name}">${v.name}${v.localService?'':' (online)'}</option>`).join('');
  const exact=voices.some(v=>norm(v.lang)===c);
  $('vnote').textContent=!synth?'Your browser does not support speech synthesis. Try Chrome, Edge or Safari.':(!exact&&c?'No exact match for this accent on your device, using the closest voice.':'Voices come from your device, so the list varies by browser and system. Edge and Chrome usually have the most.');
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else loadVoices();
acc.onchange=()=>{fillVoices();restartIfPlaying()};
voice.onchange=restartIfPlaying;
rate.oninput=()=>{$('rv').textContent=(+rate.value).toFixed(2).replace(/0$/,'')};
pitch.oninput=()=>{$('pv').textContent=(+pitch.value).toFixed(2).replace(/0$/,'')};
rate.onchange=pitch.onchange=restartIfPlaying;

function split(t){
  const paras=t.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  const out=[];
  paras.forEach((p,pi)=>{
    const sents=p.match(/[^.!?。！？]+[.!?。！？]+["'”’)\]]*\s*|[^.!?。！？]+$/g)||[p];
    let cur='';
    sents.forEach(s=>{
      if((cur+s).length>220&&cur){out.push({t:cur.trim(),p:pi});cur=''}
      cur+=s;
      while(cur.length>320){const k=cur.lastIndexOf(' ',300);const cut=k>50?k:300;out.push({t:cur.slice(0,cut).trim(),p:pi});cur=cur.slice(cut)}
    });
    if(cur.trim())out.push({t:cur.trim(),p:pi});
  });
  return out;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function build(){
  stop();
  chunks=split(txt.value);
  reader.innerHTML='';spans=[];
  let lastP=-1,pEl=null;
  chunks.forEach((c,i)=>{
    if(c.p!==lastP){pEl=document.createElement('p');reader.appendChild(pEl);lastP=c.p}
    const s=document.createElement('span');s.textContent=c.t+' ';s.onclick=()=>{idx=i;play()};
    pEl.appendChild(s);spans.push(s);
  });
  if(!chunks.length)reader.innerHTML='<em style="color:var(--mut)">Your text will appear here as you listen. Click any sentence to start from there.</em>';
  seek.max=Math.max(0,chunks.length-1);seek.value=0;idx=0;update();
  const w=txt.value.trim().split(/\s+/).filter(Boolean).length;
  $('count').textContent=w?`${w.toLocaleString()} words · about ${Math.max(1,Math.round(w/150/(+rate.value)))} min`:'';
}
let bt;txt.oninput=()=>{clearTimeout(bt);bt=setTimeout(build,400)};
async function pdfText(f){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    $('rec').textContent='Reading PDF page '+i+' of '+pdf.numPages+'…';
    const c=await (await pdf.getPage(i)).getTextContent();
    let line='',lastY=null;const lines=[];
    c.items.forEach(it=>{
      const y=it.transform[5];
      if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(line);line=''}
      line+=it.str;lastY=y;
      if(it.hasEOL){lines.push(line);line='';lastY=null}
    });
    lines.push(line);
    out.push(lines.map(l=>l.trim()).filter(Boolean).join(' '));
  }
  $('rec').textContent='';
  return out.filter(Boolean).join('\n\n');
}
file.onchange=async()=>{
  const f=file.files[0];if(!f)return;
  try{
    let t;
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      if(!window.pdfjsLib)throw new Error('PDF reader did not load');
      t=await pdfText(f);
      if(!t.trim()){$('rec').textContent='This PDF has no selectable text (it may be a scan). Try a text-based PDF.';file.value='';return}
    }else{
      t=await f.text();
      if(/\.html?$/i.test(f.name)){const d=new DOMParser().parseFromString(t,'text/html');t=d.body.innerText||d.body.textContent}
    }
    txt.value=t;build();
  }catch(e){$('rec').textContent='Could not read that file: '+e.message}
  file.value='';
};
function sample(){
  txt.value="Chapter One\n\nIt was a bright cold day in April, and the clocks were striking thirteen. The old lighthouse keeper climbed the spiral stairs one more time, as he had done every evening for forty years.\n\nFrom the top, the sea stretched out like hammered silver. He lit the lamp, and the beam swept across the water, searching for ships that were not there.";
  build();
}

function update(){
  seek.value=idx;
  $('pos').textContent=chunks.length?`${Math.min(idx+1,chunks.length)} / ${chunks.length}`:'';
  spans.forEach((s,i)=>s.classList.toggle('on',i===idx&&(playing||idx>0)));
  const s=spans[idx];
  if(s&&playing){const r=s.getBoundingClientRect(),rr=reader.getBoundingClientRect();if(r.top<rr.top||r.bottom>rr.bottom)reader.scrollTop+=r.top-rr.top-60}
  $('pp').textContent=playing?'⏸ Pause':'▶ Play';
}
function speak(){
  if(!synth||!chunks.length)return;
  const my=++token;
  synth.cancel();
  if(idx>=chunks.length){playing=false;idx=0;update();return}
  const u=new SpeechSynthesisUtterance(chunks[idx].t);
  const v=voices.find(v=>v.name===voice.value);
  if(v){u.voice=v;u.lang=v.lang}else u.lang=acc.value||'en-US';
  u.rate=+rate.value;u.pitch=+pitch.value;
  u.onend=()=>{if(my!==token||!playing)return;idx++;if(idx>=chunks.length){playing=false;idx=0}update();if(playing)speak();else setTimeout(finishRec,700)};
  u.onerror=e=>{if(my!==token)return;if(e.error==='canceled'||e.error==='interrupted')return;playing=false;update()};
  update();
  setTimeout(()=>{if(my===token)synth.speak(u)},30);
}
function play(){if(!chunks.length)build();if(!chunks.length)return;playing=true;if(recorder&&recorder.state==='paused')recorder.resume();speak()}
function toggle(){
  if(!chunks.length){build();if(!chunks.length)return}
  if(playing){playing=false;token++;synth.cancel();if(recorder&&recorder.state==='recording')recorder.pause();update()}else play();
}
function stop(){playing=false;token++;if(synth)synth.cancel();idx=0;update();finishRec()}
function skip(d){if(!chunks.length)return;idx=Math.max(0,Math.min(chunks.length-1,idx+d));if(playing)speak();else update()}
function restartIfPlaying(){if(playing)speak()}
seek.oninput=()=>{idx=+seek.value;if(playing)speak();else update()};
let recorder=null,recChunks=[],recStream=null;
async function recordMp3(){
  if(recorder&&recorder.state!=='inactive'){stop();return}
  if(!chunks.length){build();if(!chunks.length){$('rec').textContent='Add some text first.';return}}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){$('rec').textContent='Recording is not supported in this browser. Try desktop Chrome or Edge.';return}
  try{
    $('rec').textContent='In the popup, choose “This tab” and tick “Share tab audio”…';
    recStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,preferCurrentTab:true,selfBrowserSurface:'include',systemAudio:'include'});
  }catch(e){$('rec').textContent='Recording was cancelled or blocked here. If this page is shown inside a preview, open its link in its own browser tab and try again.';return}
  const at=recStream.getAudioTracks();
  if(!at.length){recStream.getTracks().forEach(t=>t.stop());recStream=null;$('rec').textContent='No audio was shared. Try again and tick “Share tab audio”.';return}
  recChunks=[];
  recorder=new MediaRecorder(new MediaStream(at));
  recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  recorder.onstop=encodeAndSave;
  recorder.start(1000);
  $('mp3b').textContent='⏹ Finish & save MP3';
  $('rec').textContent='⏺ Recording as it reads. Keep this tab open and unmuted. It saves automatically at the end.';
  idx=0;play();
}
function finishRec(){if(recorder&&recorder.state!=='inactive')recorder.stop()}
function toMp3(buf){
  const n=buf.length,sr=buf.sampleRate,chs=[];
  for(let c=0;c<buf.numberOfChannels;c++)chs.push(buf.getChannelData(c));
  const m=new Int16Array(n);
  for(let i=0;i<n;i++){let v=0;for(const ch of chs)v+=ch[i];v/=chs.length;v=Math.max(-1,Math.min(1,v));m[i]=v<0?v*32768:v*32767}
  const enc=new lamejs.Mp3Encoder(1,sr,96),parts=[];
  for(let i=0;i<n;i+=1152){const b=enc.encodeBuffer(m.subarray(i,i+1152));if(b.length)parts.push(new Int8Array(b))}
  const f=enc.flush();if(f.length)parts.push(new Int8Array(f));
  return new Blob(parts,{type:'audio/mpeg'});
}
async function encodeAndSave(){
  if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null}
  $('mp3b').textContent='⏺ Save as MP3';
  const blob=new Blob(recChunks,{type:(recorder&&recorder.mimeType)||'audio/webm'});recorder=null;
  if(blob.size<2000){$('rec').textContent='Nothing was recorded. Make sure you ticked “Share tab audio”.';return}
  try{
    $('rec').textContent='Converting to MP3…';
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
    const mp3=toMp3(buf);
    const rec=$('rec');rec.textContent='MP3 ready ('+(mp3.size/1048576).toFixed(1)+' MB). ';
    const au=document.createElement('audio');au.controls=true;au.style.cssText='display:block;margin-top:8px;width:100%';au.src=URL.createObjectURL(mp3);rec.appendChild(au);
    let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
    if(dl){
      const z=new JSZip();z.file('audiobook.mp3',mp3);
      const zb=await z.generateAsync({type:'blob'});
      try{await dl.save({filename:'audiobook.zip',data:zb});rec.insertBefore(document.createTextNode('Saved as audiobook.zip. Unzip it to get your MP3. '),au)}
      catch(e){rec.insertBefore(document.createTextNode(e&&e.code==='declined'?'Save cancelled. ':'Could not save the file. '),au)}
    }else{
      const a=document.createElement('a');a.href=au.src;a.download='audiobook.mp3';document.body.appendChild(a);a.click();a.remove();
    }
  }catch(e){$('rec').textContent='Could not convert the recording: '+(e&&e.message||e)}
}
window.addEventListener('beforeunload',()=>synth&&synth.cancel());
</script>
</body>
</html>
